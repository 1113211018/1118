<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dessert Tetris - 甜點烘焙坊俄羅斯方塊</title>
  <!-- 引入圓潤可愛的中英文字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF8F0;
      --bg-pink: #FFE8EE;
      --panel-bg: rgba(255, 255, 255, 0.88);
      --cocoa-dark: #5C3A21;
      --cocoa-mid: #8B5A3C;
      --cocoa-light: #C89F81;
      --strawberry: #FF6B8B;
      --strawberry-dark: #E04869;
      --mint: #7ED9B4;
      --vanilla: #FFF3D1;
      --shadow-soft: 0 10px 25px rgba(92, 58, 33, 0.12);
      --border-cookie: 3px solid #EED6C4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif;
      background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-pink) 100%);
      color: var(--cocoa-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 10px;
    }

    /* 背景飄浮糖粒與小點裝飾 */
    .sprinkles-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sprinkle {
      position: absolute;
      border-radius: 999px;
      opacity: 0.45;
      animation: floatSprinkle linear infinite;
    }

    @keyframes floatSprinkle {
      0% {
        transform: translateY(105vh) rotate(0deg);
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
      }
    }

    /* 主容器 */
    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 頂部標題與功能列 */
    header {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-bg);
      border: var(--border-cookie);
      border-radius: 24px;
      padding: 10px 20px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px);
      gap: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      font-size: 28px;
      background: #FFE0E9;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -3px 0 rgba(224, 72, 105, 0.2);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--cocoa-dark);
      line-height: 1.1;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--cocoa-mid);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: #FFF;
      border: 2px solid #E8CBB6;
      color: var(--cocoa-dark);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #E8CBB6;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .pill-btn:hover {
      background: #FFF9F3;
    }

    .pill-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #E8CBB6;
    }

    .pill-btn.active {
      background: var(--strawberry);
      border-color: var(--strawberry-dark);
      color: #FFF;
      box-shadow: 0 3px 0 var(--strawberry-dark);
    }

    /* 遊戲主舞台佈局 */
    .game-stage {
      display: grid;
      grid-template-columns: 150px auto 175px;
      gap: 16px;
      align-items: start;
      justify-content: center;
      width: 100%;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--panel-bg);
      border: var(--border-cookie);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--cocoa-mid);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .mini-canvas-wrap {
      background: #FFFDF9;
      border: 2px dashed #E7D0BE;
      border-radius: 16px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .dessert-tag {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--strawberry-dark);
      background: #FFF0F4;
      padding: 3px 10px;
      border-radius: 999px;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 數據統計方塊 */
    .stat-box {
      background: #FFFDF9;
      border: 2px solid #F1DFD0;
      border-radius: 14px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .stat-box:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--cocoa-mid);
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--cocoa-dark);
      font-variant-numeric: tabular-nums;
    }

    /* 中央遊戲畫布外框 */
    .board-container {
      position: relative;
      background: #FFF;
      border: 6px solid #E9C7B0;
      border-radius: 26px;
      padding: 8px;
      box-shadow: 0 14px 32px rgba(92, 58, 33, 0.16), inset 0 0 0 3px #FFF6EE;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#board {
      display: block;
      border-radius: 16px;
      background: #FFFBF6;
    }

    /* 浮動提示文字（Combo / 消行加分） */
    .floating-toast {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-weight: 900;
      font-size: 1.4rem;
      color: #FF4D79;
      text-shadow: 0 2px 0 #FFF, 0 -2px 0 #FFF, 2px 0 0 #FFF, -2px 0 0 #FFF, 0 4px 10px rgba(255, 77, 121, 0.35);
      opacity: 0;
      white-space: nowrap;
      z-index: 5;
    }

    .floating-toast.show {
      animation: toastPop 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes toastPop {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
      25% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); }
      80% { opacity: 1; transform: translate(-50%, -28px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -42px) scale(0.95); }
    }

    /* 遊戲開始 / 暫停 / 結束 遮罩層 */
    .overlay {
      position: absolute;
      inset: 8px;
      border-radius: 16px;
      background: rgba(255, 248, 242, 0.92);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.25s;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-icon {
      font-size: 3.2rem;
      margin-bottom: 8px;
      animation: bounceSweet 1.6s ease-in-out infinite;
    }

    @keyframes bounceSweet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .overlay h2 {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--cocoa-dark);
      margin-bottom: 6px;
    }

    .overlay p {
      font-size: 0.9rem;
      color: var(--cocoa-mid);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .primary-btn {
      background: linear-gradient(180deg, #FF7D9B 0%, #FF577F 100%);
      color: #FFF;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #D93B62, 0 8px 18px rgba(255, 87, 127, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #D93B62;
    }

    /* 操作提示（桌機版） */
    .controls-hint {
      font-size: 0.76rem;
      color: var(--cocoa-mid);
      text-align: left;
      line-height: 1.65;
    }

    .kbd {
      display: inline-block;
      background: #FFF;
      border: 1.5px solid #DFC3AE;
      border-radius: 6px;
      padding: 0 5px;
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--cocoa-dark);
      box-shadow: 0 1px 0 #DFC3AE;
    }

    /* 手機版虛擬觸控控制器 */
    .touch-controls {
      display: none;
      width: 100%;
      max-width: 440px;
      gap: 8px;
      margin-top: 4px;
    }

    .touch-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .pad-btn {
      background: #FFF;
      border: 2.5px solid #E5C5AE;
      border-radius: 18px;
      padding: 12px 6px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--cocoa-dark);
      box-shadow: 0 4px 0 #E5C5AE;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
    }

    .pad-btn span {
      font-size: 0.68rem;
      color: var(--cocoa-mid);
    }

    .pad-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #E5C5AE;
      background: #FFF4EC;
    }

    .pad-btn.accent {
      background: #FFF0F4;
      border-color: #F6B3C5;
      box-shadow: 0 4px 0 #F6B3C5;
      color: var(--strawberry-dark);
    }

    /* 甜點圖鑑彈窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(92, 58, 33, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-card {
      background: #FFFBF6;
      border: 4px solid #E8C7B0;
      border-radius: 28px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 45px rgba(92, 58, 33, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 2px dashed #EBD2C0;
      padding-bottom: 10px;
    }

    .modal-header h3 {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--cocoa-dark);
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }

    .dex-item {
      background: #FFF;
      border: 2px solid #F0DDD0;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dex-info h4 {
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--cocoa-dark);
    }

    .dex-info p {
      font-size: 0.76rem;
      color: var(--cocoa-mid);
      margin-top: 2px;
      line-height: 1.35;
    }

    /* 響應式 RWD 調整 */
    @media (max-width: 780px) {
      .game-stage {
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
      }
      .card {
        padding: 8px;
        border-radius: 16px;
      }
      .card-title {
        font-size: 0.72rem;
        margin-bottom: 4px;
      }
      .stat-value {
        font-size: 1.05rem;
      }
      .desktop-only {
        display: none;
      }
      .touch-controls {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 8px 14px;
      }
      h1 {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .game-stage {
        grid-template-columns: 88px auto 88px;
        gap: 6px;
      }
      .dessert-tag {
        font-size: 0.65rem;
        padding: 2px 6px;
      }
      .stat-box {
        padding: 5px 6px;
        margin-bottom: 5px;
      }
      .stat-label {
        font-size: 0.65rem;
      }
      .stat-value {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- 背景飄浮糖粒裝飾 -->
  <div class="sprinkles-bg" id="sprinklesBg"></div>

  <div class="app-wrapper">
    <!-- 頂部導覽列 -->
    <header>
      <div class="title-group">
        <div class="logo-badge">🍰</div>
        <div>
          <h1>Dessert Tetris</h1>
          <div class="subtitle">粉嫩下午茶烘焙坊 • 甜點俄羅斯方塊</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="pill-btn" id="themeToggleBtn" title="切換甜點造型與經典糖果方塊">
          🧁 <span id="themeToggleText">甜點造型</span>
        </button>
        <button class="pill-btn" id="dexOpenBtn" title="查看7種甜點圖鑑">
          📖 甜點圖鑑
        </button>
        <button class="pill-btn" id="soundToggleBtn" title="開啟或關閉烘焙坊音效與音樂">
          🔊 <span id="soundToggleText">音效開</span>
        </button>
        <button class="pill-btn" id="pauseBtn" title="暫停遊戲 (P)">
          ⏸️ 暫停
        </button>
      </div>
    </header>

    <!-- 遊戲主舞台 -->
    <main class="game-stage">
      <!-- 左側欄：暫存方塊 & 操作指南 -->
      <div class="side-col">
        <div class="card">
          <div class="card-title">🥡 暫存餐盤 (C)</div>
          <div class="mini-canvas-wrap">
            <canvas id="holdCanvas" width="96" height="76"></canvas>
          </div>
          <div class="dessert-tag" id="holdDessertName">空餐盤</div>
        </div>

        <div class="card desktop-only">
          <div class="card-title">⌨️ 烘焙操作</div>
          <div class="controls-hint">
            <div><span class="kbd">←</span> <span class="kbd">→</span> 左右移動</div>
            <div><span class="kbd">↑</span> / <span class="kbd">X</span> 順時針旋轉</div>
            <div><span class="kbd">Z</span> 逆時針旋轉</div>
            <div><span class="kbd">↓</span> 加速軟降</div>
            <div><span class="kbd">Space</span> 瞬間硬降</div>
            <div><span class="kbd">C</span> 暫存甜點</div>
            <div><span class="kbd">P</span> 暫停遊戲</div>
          </div>
        </div>
      </div>

      <!-- 中央棋盤 -->
      <div class="board-container">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="floating-toast" id="floatingToast">TETRIS! +800</div>

        <!-- 開始 / 暫停 / 結束 覆蓋層 -->
        <div class="overlay" id="gameOverlay">
          <div class="overlay-icon" id="overlayIcon">🍓</div>
          <h2 id="overlayTitle">歡迎來到甜點烘焙坊！</h2>
          <p id="overlayDesc">堆疊美味的馬卡龍、閃電泡芙與草莓蛋糕，<br>填滿整排即可完成訂單並獲得高分！</p>
          <button class="primary-btn" id="startBtn">開始烘焙 🍰</button>
        </div>
      </div>

      <!-- 右側欄：下一個預覽 & 分數等級 -->
      <div class="side-col">
        <div class="card">
          <div class="card-title">🔔 下一道甜點</div>
          <div class="mini-canvas-wrap">
            <canvas id="nextCanvas" width="96" height="76"></canvas>
          </div>
          <div class="dessert-tag" id="nextDessertName">準備中</div>
        </div>

        <div class="card">
          <div class="card-title">🏆 烘焙成績</div>
          <div class="stat-box">
            <div class="stat-label">目前分數</div>
            <div class="stat-value" id="scoreVal">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">最高紀錄</div>
            <div class="stat-value" id="highScoreVal">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">烘焙等級</div>
            <div class="stat-value" id="levelVal">1</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">完成排數</div>
            <div class="stat-value" id="linesVal">0</div>
          </div>
        </div>
      </div>
    </main>

    <!-- 手機版虛擬觸控按鍵 -->
    <section class="touch-controls" aria-label="觸控操作按鈕">
      <div class="touch-row">
        <button class="pad-btn" id="btnHold">🥡<span>暫存</span></button>
        <button class="pad-btn" id="btnRotateCCW">↺<span>左轉</span></button>
        <button class="pad-btn" id="btnRotateCW">↻<span>右轉</span></button>
        <button class="pad-btn accent" id="btnHardDrop">⏬<span>硬降</span></button>
      </div>
      <div class="touch-row">
        <button class="pad-btn" id="btnLeft">⬅️<span>左移</span></button>
        <button class="pad-btn" id="btnSoftDrop">⬇️<span>軟降</span></button>
        <button class="pad-btn" id="btnRight">➡️<span>右移</span></button>
        <button class="pad-btn" id="btnMobilePause">⏸️<span>暫停</span></button>
      </div>
    </section>
  </div>

  <!-- 甜點圖鑑彈窗 -->
  <div class="modal-backdrop hidden" id="dexModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📖 烘焙坊 7 大招牌甜點圖鑑</h3>
        <button class="pill-btn" id="dexCloseBtn">✕ 關閉</button>
      </div>
      <div class="dex-grid" id="dexGrid"></div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * DESSERT TETRIS - 甜點烘焙坊俄羅斯方塊
     * 單一 HTML 檔案設計，無外部圖片或音檔依賴，可直接部署至 GitHub Pages
     * ============================================================================
     */

    // ----------------------------------------------------------------------------
    // 1. 生成背景飄浮糖粒裝飾
    // ----------------------------------------------------------------------------
    (function initSprinkles() {
      const container = document.getElementById('sprinklesBg');
      const colors = ['#FF8FA3', '#FFD166', '#80ED99', '#A0C4FF', '#BDB2FF', '#FFADAD'];
      for (let i = 0; i < 28; i++) {
        const el = document.createElement('div');
        el.className = 'sprinkle';
        const isPill = Math.random() > 0.4;
        const size = 6 + Math.random() * 8;
        el.style.width = isPill ? `${size * 2.1}px` : `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${Math.random() * 100}vw`;
        el.style.backgroundColor = colors[i % colors.length];
        el.style.animationDuration = `${12 + Math.random() * 16}s`;
        el.style.animationDelay = `${-Math.random() * 20}s`;
        container.appendChild(el);
      }
    })();

    // ----------------------------------------------------------------------------
    // 2. Web Audio API 甜點音效與輕快下午茶背景音樂合成器
    // ----------------------------------------------------------------------------
    class BakeryAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.bgmTimer = null;
        this.noteIndex = 0;
        // 輕快八音盒風格旋律 (C大調下午茶圓舞曲感)
        this.melody = [
          523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46,
          659.25, 783.99, 1046.50, 783.99, 587.33, 523.25, 493.88, 587.33
        ];
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, volume = 0.12, slideTo = null) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      move() {
        this.playTone(420, 'triangle', 0.05, 0.06, 480);
      }

      rotate() {
        this.playTone(540, 'sine', 0.09, 0.1, 720);
      }

      drop() {
        // 軟綿綿的甜點落地聲
        this.playTone(210, 'sine', 0.12, 0.15, 110);
      }

      hold() {
        this.playTone(620, 'triangle', 0.08, 0.09, 440);
      }

      clear(lines) {
        if (!this.enabled) return;
        this.init();
        const chords = {
          1: [523.25, 659.25, 783.99],
          2: [587.33, 739.99, 880.00, 1174.66],
          3: [659.25, 830.61, 987.77, 1318.51],
          4: [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]
        };
        const notes = chords[lines] || chords[1];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'triangle', 0.22, 0.14);
          }, idx * 55);
        });
      }

      gameOver() {
        if (!this.enabled) return;
        const notes = [440, 392, 349.23, 329.63, 261.63];
        notes.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'sawtooth', 0.25, 0.07), i * 130);
        });
      }

      startBGM() {
        this.stopBGM();
        if (!this.enabled) return;
        this.bgmTimer = setInterval(() => {
          if (!this.enabled || !game.running || game.paused || game.gameOver) return;
          const freq = this.melody[this.noteIndex % this.melody.length];
          this.playTone(freq, 'sine', 0.24, 0.032);
          this.noteIndex++;
        }, 360);
      }

      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }
    }

    const audio = new BakeryAudio();

    // ----------------------------------------------------------------------------
    // 3. 7 種甜點方塊定義與 Canvas 2D 精緻甜點繪製引擎
    // ----------------------------------------------------------------------------
    const DESSERTS = {

    const PIECE_KEYS = Object.keys(DESSERTS);

    /**
     * 繪製單一甜點方塊格子 (支援相鄰融合感與精緻細節)
     */
    function drawDessertCell(ctx, px, py, size, type, isDessertMode = true, alpha = 1, neighbors = {}) {
      const def = DESSERTS[type];
      if (!def) return;

      ctx.save();
      ctx.globalAlpha = alpha;

      const pad = 1.2;
      const x = px + pad;
      const y = py + pad;
      const w = size - pad * 2;
      const h = size - pad * 2;
      const r = Math.max(5, size * 0.22);

      // 輔助函式：圓角矩形
      const roundRect = (rx, ry, rw, rh, rad) => {
        ctx.beginPath();
        ctx.roundRect(rx, ry, rw, rh, rad);
      };

      if (!isDessertMode) {
        // 經典糖果方塊模式
        roundRect(x, y, w, h, r);
        ctx.fillStyle = def.classicColor;
        ctx.fill();

        // 頂部高光
        roundRect(x + 3, y + 3, w - 6, h * 0.38, r * 0.6);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.fill();

        // 外框
        roundRect(x, y, w, h, r);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(92, 58, 33, 0.25)';
        ctx.stroke();
        ctx.restore();
        return;
      }

      // === 精緻甜點造型繪製 ===
      // 1. 底部立體陰影
      roundRect(x, y + 2, w, h - 1, r);
      ctx.fillStyle = 'rgba(92, 58, 33, 0.18)';
      ctx.fill();

      // 2. 餅乾 / 蛋糕主體基底
      roundRect(x, y, w, h - 1.5, r);
      ctx.fillStyle = def.baseColor;
      ctx.fill();

      // 依據不同甜點繪製專屬紋理與配料
      switch (type) {
        case 'I': {
          // 法式閃電泡芙：上部濃郁巧克力淋醬 + 白色糖霜 Zigzag
          roundRect(x + 1.5, y + 1.5, w - 3, h * 0.56, [r, r, 4, 4]);
          ctx.fillStyle = def.icingColor;
          ctx.fill();

          // 白色細紋裝飾
          ctx.strokeStyle = def.accentColor;
          ctx.lineWidth = Math.max(1.4, size * 0.06);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x + w * 0.22, y + h * 0.22);
          ctx.lineTo(x + w * 0.45, y + h * 0.42);
          ctx.lineTo(x + w * 0.68, y + h * 0.20);
          ctx.lineTo(x + w * 0.82, y + h * 0.38);
          ctx.stroke();
          break;
        }
        case 'O': {
          // 草莓奶油方塊蛋糕：中間白色鮮奶油夾層 + 頂部草莓
          ctx.fillStyle = def.icingColor;
          ctx.fillRect(x + 1, y + h * 0.44, w - 2, h * 0.18);

          // 頂部淋醬波浪
          roundRect(x + 1, y + 1, w - 2, h * 0.28, [r, r, 3, 3]);
          ctx.fillStyle = '#FFFDF9';
          ctx.fill();

          // 可愛小草莓
          ctx.fillStyle = def.accentColor;
          ctx.beginPath();
          ctx.arc(x + w * 0.5, y + h * 0.34, size * 0.17, 0, Math.PI * 2);
          ctx.fill();

          // 草莓綠葉
          ctx.fillStyle = '#52B788';
          ctx.beginPath();
          ctx.ellipse(x + w * 0.5, y + h * 0.18, size * 0.12, size * 0.05, 0, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 'T': {
          // 藍莓馬卡龍：雙層餅殼 + 中間厚實藍莓內餡 + 蕾絲裙邊
          ctx.fillStyle = def.icingColor;
          roundRect(x + 1, y + h * 0.34, w - 2, h * 0.32, 4);
          ctx.fill();

          // 馬卡龍裙邊點點
          ctx.fillStyle = def.accentColor;
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.arc(x + w * (0.2 + i * 0.2), y + h * 0.68, size * 0.045, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }
        case 'S': {
          // 抹茶紅豆瑞士捲：螺旋奶油紋路 + 紅豆點綴
          ctx.strokeStyle = def.icingColor;
          ctx.lineWidth = Math.max(2.2, size * 0.11);
          ctx.beginPath();
          ctx.arc(x + w * 0.5, y + h * 0.5, size * 0.24, 0, Math.PI * 1.65);
          ctx.stroke();

          // 蜜紅豆
          ctx.fillStyle = def.accentColor;
          ctx.beginPath();
          ctx.arc(x + w * 0.42, y + h * 0.44, size * 0.075, 0, Math.PI * 2);
          ctx.arc(x + w * 0.62, y + h * 0.58, size * 0.065, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 'Z': {
          // 草莓果凍軟糖：半透明果凍光澤 + 細砂糖粒
          roundRect(x + 3, y + 3, w - 6, h - 7, r * 0.7);
          ctx.fillStyle = def.icingColor;
          ctx.fill();

          // 亮晶晶砂糖粒
          ctx.fillStyle = '#FFFFFF';
          const dots = [[0.3, 0.32], [0.68, 0.28], [0.48, 0.52], [0.32, 0.7], [0.7, 0.68]];
          dots.forEach(([dx, dy]) => {
            ctx.fillRect(x + w * dx, y + h * dy, 2, 2);
          });
          break;
        }
        case 'J': {
          // 藍莓糖霜香草餅：餅乾烘焙孔 + 藍莓糖霜頂層
          roundRect(x + 1.5, y + 1.5, w - 3, h * 0.52, [r, r, 6, 6]);
          ctx.fillStyle = def.icingColor;
          ctx.fill();

          // 糖珠裝飾
          ctx.fillStyle = def.accentColor;
          ctx.beginPath();
          ctx.arc(x + w * 0.35, y + h * 0.3, size * 0.07, 0, Math.PI * 2);
          ctx.arc(x + w * 0.66, y + h * 0.34, size * 0.06, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 'L': {
          // 焦糖柳橙夾心餅：香橙果醬層 + 柑橘瓣紋理
          roundRect(x + 2, y + 2, w - 4, h * 0.54, [r, r, 5, 5]);
          ctx.fillStyle = def.icingColor;
          ctx.fill();

          // 柳橙片高光弧線
          ctx.strokeStyle = def.accentColor;
          ctx.lineWidth = Math.max(1.5, size * 0.06);
          ctx.beginPath();
          ctx.arc(x + w * 0.5, y + h * 0.36, size * 0.16, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
          break;
        }
      }

      // 3. 統一可愛高光點與可可細邊框
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.26, y + h * 0.2, size * 0.11, size * 0.055, -0.35, 0, Math.PI * 2);
      ctx.fill();

      roundRect(x, y, w, h - 1.5, r);
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = 'rgba(92, 58, 33, 0.28)';
      ctx.stroke();

      ctx.restore();
    }

    // ----------------------------------------------------------------------------
    // 4. 俄羅斯方塊核心邏輯與狀態管理
    // ----------------------------------------------------------------------------
    const COLS = 10;
    const ROWS = 20;

    const boardCanvas = document.getElementById('board');
    const boardCtx = boardCanvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const holdCanvas = document.getElementById('holdCanvas');
    const holdCtx = holdCanvas.getContext('2d');

    const game = {
      board: [],
      current: null,
      nextType: null,
      holdType: null,
      canHold: true,
      bag: [],
      score: 0,
      highScore: Number(localStorage.getItem('dessert_tetris_high') || 0),
      level: 1,
      lines: 0,
      combo: -1,
      running: false,
      paused: false,
      gameOver: false,
      isDessertTheme: true,
      dropCounter: 0,
      lastTime: 0,
      particles: []
    };

    document.getElementById('highScoreVal').textContent = game.highScore;

    // 7-Bag 隨機生成器（保證每 7 個方塊必定包含所有 7 種甜點）
    function nextFromBag() {
      if (game.bag.length === 0) {
        game.bag = [...PIECE_KEYS];
        for (let i = game.bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [game.bag[i], game.bag[j]] = [game.bag[j], game.bag[i]];
        }
      }
      return game.bag.pop();
    }

    function createEmptyBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function cloneMatrix(matrix) {
      return matrix.map(row => [...row]);
    }

    function rotateMatrix(matrix, dir) {
      const N = matrix.length;
      const result = Array.from({ length: N }, () => Array(N).fill(0));
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (dir > 0) {
            result[x][N - 1 - y] = matrix[y][x];
          } else {
            result[N - 1 - x][y] = matrix[y][x];
          }
        }
      }
      return result;
    }

    function collide(board, piece) {
      const { matrix, x: px, y: py } = piece;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const bx = px + x;
          const by = py + y;
          if (bx < 0 || bx >= COLS || by >= ROWS) return true;
          if (by >= 0 && board[by][bx]) return true;
        }
      }
      return false;
    }

    function spawnPiece(forcedType = null) {
      const type = forcedType || game.nextType || nextFromBag();
      if (!forcedType) {
        game.nextType = nextFromBag();
      }
      const matrix = cloneMatrix(DESSERTS[type].matrix);
      const piece = {
        type,
        matrix,
        x: Math.floor((COLS - matrix[0].length) / 2),
        y: type === 'I' ? -1 : 0
      };
      game.current = piece;
      game.canHold = true;
      updateSidePreviews();

      if (collide(game.board, piece)) {
        triggerGameOver();
      }
    }

    function getDropInterval() {
      // 隨等級加快下落速度 (ms)
      return Math.max(95, 850 * Math.pow(0.86, game.level - 1));
    }

    // ----------------------------------------------------------------------------
    // 5. 玩家操作動作（移動、踢牆旋轉、軟降、硬降、暫存）
    // ----------------------------------------------------------------------------
    function movePiece(dx) {
      if (!canControl()) return;
      game.current.x += dx;
      if (collide(game.board, game.current)) {
        game.current.x -= dx;
      } else {
        audio.move();
      }
    }

    function rotatePiece(dir) {
      if (!canControl()) return;
      const originalMatrix = game.current.matrix;
      const originalX = game.current.x;
      const rotated = rotateMatrix(originalMatrix, dir);
      game.current.matrix = rotated;

      // 踢牆偏移測試 (Wall Kick)
      const kicks = [0, -1, 1, -2, 2];
      for (const offset of kicks) {
        game.current.x = originalX + offset;
        if (!collide(game.board, game.current)) {
          audio.rotate();
          return;
        }
      }

      // 無法旋轉則還原
      game.current.matrix = originalMatrix;
      game.current.x = originalX;
    }

    function softDrop() {
      if (!canControl()) return;
      game.current.y++;
      if (collide(game.board, game.current)) {
        game.current.y--;
        lockPiece();
      } else {
        addScore(1);
        game.dropCounter = 0;
      }
    }

    function hardDrop() {
      if (!canControl()) return;
      let dropped = 0;
      while (!collide(game.board, { ...game.current, y: game.current.y + 1 })) {
        game.current.y++;
        dropped++;
      }
      addScore(dropped * 2);
      spawnDropSparkles(game.current);
      lockPiece();
    }

    function holdPiece() {
      if (!canControl() || !game.canHold) return;
      audio.hold();
      const currentType = game.current.type;
      if (game.holdType === null) {
        game.holdType = currentType;
        spawnPiece();
      } else {
        const temp = game.holdType;
        game.holdType = currentType;
        spawnPiece(temp);
      }
      game.canHold = false;
      updateSidePreviews();
    }

    function canControl() {
      return game.running && !game.paused && !game.gameOver && game.current;
    }

    // ----------------------------------------------------------------------------
    // 6. 鎖定方塊、消行結算與粒子特效
    // ----------------------------------------------------------------------------
    function lockPiece() {
      const { matrix, x: px, y: py, type } = game.current;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const by = py + y;
          const bx = px + x;
          if (by < 0) {
            triggerGameOver();
            return;
          }
          game.board[by][bx] = type;
        }
      }
      audio.drop();
      clearLines();
      if (!game.gameOver) {
        spawnPiece();
      }
    }

    function clearLines() {
      let clearedRows = [];
      for (let y = ROWS - 1; y >= 0; y--) {
        if (game.board[y].every(cell => cell !== null)) {
          clearedRows.push(y);
        }
      }

      if (clearedRows.length === 0) {
        game.combo = -1;
        return;
      }

      // 產生糖霜消行粒子特效
      const cellSize = boardCanvas.width / COLS;
      clearedRows.forEach(rowIdx => {
        for (let x = 0; x < COLS; x++) {
          const type = game.board[rowIdx][x];
          const color = DESSERTS[type]?.icingColor || '#FF8FA3';
          for (let p = 0; p < 5; p++) {
            game.particles.push({
              x: (x + 0.5) * cellSize,
              y: (rowIdx + 0.5) * cellSize,
              vx: (Math.random() - 0.5) * 6,
              vy: (Math.random() - 0.8) * 6,
              size: 3 + Math.random() * 4,
              color,
              life: 1
            });
          }
        }
      });

      // 移除已滿行並從頂部補空行
      const remaining = game.board.filter((_, idx) => !clearedRows.includes(idx));
      while (remaining.length < ROWS) {
        remaining.unshift(Array(COLS).fill(null));
      }
      game.board = remaining;

      const count = clearedRows.length;
      game.combo++;
      const basePoints = [0, 100, 300, 500, 800][count] || 800;
      const comboBonus = game.combo > 0 ? game.combo * 50 * game.level : 0;
      const gained = basePoints * game.level + comboBonus;

      addScore(gained);
      game.lines += count;
      game.level = Math.floor(game.lines / 10) + 1;

      audio.clear(count);
      updateStatsUI();

      // 顯示可愛加分提示
      const labels = ['', 'SWEET! 單消', 'DELICIOUS! 雙消', 'YUMMY! 三消', 'PATISSIER TETRIS! 四消'];
      let msg = `${labels[count]} +${gained}`;
      if (game.combo > 0) msg += ` (${game.combo} COMBO!)`;
      showToast(msg);
    }

    function spawnDropSparkles(piece) {
      const cellSize = boardCanvas.width / COLS;
      for (let y = 0; y < piece.matrix.length; y++) {
        for (let x = 0; x < piece.matrix[y].length; x++) {
          if (piece.matrix[y][x]) {
            game.particles.push({
              x: (piece.x + x + 0.5) * cellSize,
              y: (piece.y + y + 0.9) * cellSize,
              vx: (Math.random() - 0.5) * 2.5,
              vy: -Math.random() * 2,
              size: 3,
              color: '#FFD166',
              life: 0.75
            });
          }
        }
      }
    }

    function addScore(pts) {
      game.score += pts;
      if (game.score > game.highScore) {
        game.highScore = game.score;
        localStorage.setItem('dessert_tetris_high', String(game.highScore));
      }
      updateStatsUI();
    }

    function updateStatsUI() {
      document.getElementById('scoreVal').textContent = game.score;
      document.getElementById('highScoreVal').textContent = game.highScore;
      document.getElementById('levelVal').textContent = game.level;
      document.getElementById('linesVal').textContent = game.lines;
    }

    function showToast(text) {
      const el = document.getElementById('floatingToast');
      el.textContent = text;
      el.classList.remove('show');
      void el.offsetWidth; // 觸發重繪重啟動畫
      el.classList.add('show');
    }

    // ----------------------------------------------------------------------------
    // 7. 繪圖與畫面更新迴圈
    // ----------------------------------------------------------------------------
    function getGhostY() {
      let ghostY = game.current.y;
      while (!collide(game.board, { ...game.current, y: ghostY + 1 })) {
        ghostY++;
      }
      return ghostY;
    }

    function drawBoard() {
      const W = boardCanvas.width;
      const H = boardCanvas.height;
      const cellSize = W / COLS;

      boardCtx.clearRect(0, 0, W, H);

      // 1. 烘焙方格紙背景格線
      boardCtx.strokeStyle = 'rgba(226, 195, 173, 0.35)';
      boardCtx.lineWidth = 1;
      for (let x = 1; x < COLS; x++) {
        boardCtx.beginPath();
        boardCtx.moveTo(x * cellSize, 0);
        boardCtx.lineTo(x * cellSize, H);
        boardCtx.stroke();
      }
      for (let y = 1; y < ROWS; y++) {
        boardCtx.beginPath();
        boardCtx.moveTo(0, y * cellSize);
        boardCtx.lineTo(W, y * cellSize);
        boardCtx.stroke();
      }

      // 2. 已固定的甜點方塊
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const type = game.board[y][x];
          if (type) {
            drawDessertCell(boardCtx, x * cellSize, y * cellSize, cellSize, type, game.isDessertTheme, 1);
          }
        }
      }

      // 3. 落點預覽虛影 (Ghost Piece) 與目前操作中的方塊
      if (game.current && !game.gameOver) {
        const ghostY = getGhostY();
        const { matrix, x: px, y: py, type } = game.current;

        // 繪製落點投影
        for (let y = 0; y < matrix.length; y++) {
          for (let x = 0; x < matrix[y].length; x++) {
            if (!matrix[y][x]) continue;
            if (ghostY + y >= 0) {
              drawDessertCell(
                boardCtx,
                (px + x) * cellSize,
                (ghostY + y) * cellSize,
                cellSize,
                type,
                game.isDessertTheme,
                0.22
              );
            }
          }
        }

        // 繪製目前方塊
        for (let y = 0; y < matrix.length; y++) {
          for (let x = 0; x < matrix[y].length; x++) {
            if (!matrix[y][x]) continue;
            if (py + y >= 0) {
              drawDessertCell(
                boardCtx,
                (px + x) * cellSize,
                (py + y) * cellSize,
                cellSize,
                type,
                game.isDessertTheme,
                1
              );
            }
          }
        }
      }

      // 4. 繪製與更新糖粒粒子特效
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.life -= 0.03;
        if (p.life <= 0) {
          game.particles.splice(i, 1);
          continue;
        }
        boardCtx.save();
        boardCtx.globalAlpha = p.life;
        boardCtx.fillStyle = p.color;
        boardCtx.beginPath();
        boardCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        boardCtx.fill();
        boardCtx.restore();
      }
    }

    function drawMiniPiece(ctx, canvas, type) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!type) return;
      const matrix = DESSERTS[type].matrix;
      // 計算實際有效邊界以置中繪製
      let minX = 99, maxX = -1, minY = 99, maxY = -1;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (matrix[y][x]) {
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);
          }
        }
      }
      const pw = maxX - minX + 1;
      const ph = maxY - minY + 1;
      const cellSize = Math.min(20, (canvas.width - 16) / Math.max(pw, 3));
      const offsetX = (canvas.width - pw * cellSize) / 2;
      const offsetY = (canvas.height - ph * cellSize) / 2;

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          if (matrix[y][x]) {
            drawDessertCell(
              ctx,
              offsetX + (x - minX) * cellSize,
              offsetY + (y - minY) * cellSize,
              cellSize,
              type,
              game.isDessertTheme,
              1
            );
          }
        }
      }
    }

    function updateSidePreviews() {
      drawMiniPiece(nextCtx, nextCanvas, game.nextType);
      document.getElementById('nextDessertName').textContent =
        game.nextType ? DESSERTS[game.nextType].name : '準備中';

      drawMiniPiece(holdCtx, holdCanvas, game.holdType);
      document.getElementById('holdDessertName').textContent =
        game.holdType ? DESSERTS[game.holdType].name : '空餐盤';
    }

    function gameLoop(time = 0) {
      const delta = time - game.lastTime;
      game.lastTime = time;

      if (game.running && !game.paused && !game.gameOver) {
        game.dropCounter += delta;
        if (game.dropCounter > getDropInterval()) {
          game.current.y++;
          if (collide(game.board, game.current)) {
            game.current.y--;
            lockPiece();
          }
          game.dropCounter = 0;
        }
      }

      drawBoard();
      requestAnimationFrame(gameLoop);
    }

    // ----------------------------------------------------------------------------
    // 8. 遊戲流程控制（開始、暫停、結束、RWD 畫布自適應）
    // ----------------------------------------------------------------------------
    function startGame() {
      audio.init();
      game.board = createEmptyBoard();
      game.bag = [];
      game.score = 0;
      game.level = 1;
      game.lines = 0;
      game.combo = -1;
      game.holdType = null;
      game.canHold = true;
      game.nextType = nextFromBag();
      game.running = true;
      game.paused = false;
      game.gameOver = false;
      game.dropCounter = 0;
      game.particles = [];

      updateStatsUI();
      spawnPiece();
      hideOverlay();
      audio.startBGM();
    }

    function togglePause() {
      if (!game.running || game.gameOver) return;
      game.paused = !game.paused;
      const pauseBtn = document.getElementById('pauseBtn');
      if (game.paused) {
        pauseBtn.innerHTML = '▶️ 繼續';
        showOverlay('☕', '下午茶休息時間', '遊戲已暫停，隨時準備好繼續烘焙！', '繼續遊戲 🍰');
      } else {
        pauseBtn.innerHTML = '⏸️ 暫停';
        hideOverlay();
      }
    }

    function triggerGameOver() {
      game.gameOver = true;
      game.running = false;
      audio.stopBGM();
      audio.gameOver();
      showOverlay(
        '🎂',
        '甜點塔滿出來啦！',
        `本次烘焙得分：${game.score} 分（消除 ${game.lines} 排）`,
        '再來一盤 🔄'
      );
    }

    function showOverlay(icon, title, desc, btnText) {
      document.getElementById('overlayIcon').textContent = icon;
      document.getElementById('overlayTitle').textContent = title;
      document.getElementById('overlayDesc').innerHTML = desc;
      document.getElementById('startBtn').textContent = btnText;
      document.getElementById('gameOverlay').classList.remove('hidden');
    }

    function hideOverlay() {
      document.getElementById('gameOverlay').classList.add('hidden');
    }

    // 響應式調整主畫布大小（確保手機與桌機都清晰無卷軸）
    function resizeBoardCanvas() {
      const isMobile = window.innerWidth <= 780;
      const maxH = isMobile ? window.innerHeight * 0.54 : Math.min(600, window.innerHeight * 0.74);
      const cell = Math.max(16, Math.floor(maxH / ROWS));
      boardCanvas.width = cell * COLS;
      boardCanvas.height = cell * ROWS;
      drawBoard();
    }

    window.addEventListener('resize', resizeBoardCanvas);
    resizeBoardCanvas();

    // ----------------------------------------------------------------------------
    // 9. 鍵盤、觸控按鈕與圖鑑互動事件綁定
    // ----------------------------------------------------------------------------
    document.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'KeyP') {
        togglePause();
        return;
      }
      if (!canControl()) return;

      switch (e.code) {
        case 'ArrowLeft':
          movePiece(-1);
          break;
        case 'ArrowRight':
          movePiece(1);
          break;
        case 'ArrowDown':
          softDrop();
          break;
        case 'ArrowUp':
        case 'KeyX':
          rotatePiece(1);
          break;
        case 'KeyZ':
          rotatePiece(-1);
          break;
        case 'Space':
          hardDrop();
          break;
        case 'KeyC':
          holdPiece();
          break;
      }
    });

    // 開始 / 繼續按鈕
    document.getElementById('startBtn').addEventListener('click', () => {
      if (game.paused) {
        togglePause();
      } else {
        startGame();
      }
    });

    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('btnMobilePause').addEventListener('click', togglePause);

    // 切換甜點造型 / 經典糖果方塊
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      game.isDessertTheme = !game.isDessertTheme;
      document.getElementById('themeToggleText').textContent =
        game.isDessertTheme ? '甜點造型' : '經典糖果';
      updateSidePreviews();
      drawBoard();
    });

    // 音效開關
    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      const btn = document.getElementById('soundToggleBtn');
      const txt = document.getElementById('soundToggleText');
      if (audio.enabled) {
        btn.innerHTML = '🔊 <span id="soundToggleText">音效開</span>';
        audio.startBGM();
      } else {
        btn.innerHTML = '🔇 <span id="soundToggleText">靜音中</span>';
        audio.stopBGM();
      }
    });

    // 虛擬觸控按鍵綁定
    const bindPad = (id, fn) => {
      const el = document.getElementById(id);
      el.addEventListener('click', (e) => {
        e.preventDefault();
        fn();
      });
    };
    bindPad('btnLeft', () => movePiece(-1));
    bindPad('btnRight', () => movePiece(1));
    bindPad('btnSoftDrop', () => softDrop());
    bindPad('btnHardDrop', () => hardDrop());
    bindPad('btnRotateCW', () => rotatePiece(1));
    bindPad('btnRotateCCW', () => rotatePiece(-1));
    bindPad('btnHold', () => holdPiece());

    // 甜點圖鑑彈窗渲染
    function renderDessertDex() {
      const grid = document.getElementById('dexGrid');
      grid.innerHTML = '';
      PIECE_KEYS.forEach(key => {
        const item = DESSERTS[key];
        const card = document.createElement('div');
        card.className = 'dex-item';

        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 54;
        const cCtx = c.getContext('2d');
        const m = item.matrix;
        const size = 15;
        const ox = (c.width - m[0].length * size) / 2;
        const oy = (c.height - m.length * size) / 2 + 4;
        for (let y = 0; y < m.length; y++) {
          for (let x = 0; x < m[y].length; x++) {
            if (m[y][x]) {
              drawDessertCell(cCtx, ox + x * size, oy + y * size, size, key, true, 1);
            }
          }
        }

        const info = document.createElement('div');
        info.className = 'dex-info';
        info.innerHTML = `<h4>${key} 型・${item.name}</h4><p>${item.desc}</p>`;

        card.appendChild(c);
        card.appendChild(info);
        grid.appendChild(card);
      });
    }

    document.getElementById('dexOpenBtn').addEventListener('click', () => {
      if (game.running && !game.paused && !game.gameOver) {
        togglePause();
      }
      renderDessertDex();
      document.getElementById('dexModal').classList.remove('hidden');
    });

    document.getElementById('dexCloseBtn').addEventListener('click', () => {
      document.getElementById('dexModal').classList.add('hidden');
    });

    // 啟動繪圖迴圈
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
